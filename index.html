<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="orb"></div>
        <div class="titleblock">
          <h1>أوجن | الجوهرة الذكية</h1>
          <div class="status" id="statusText">متصلة بالنواة</div>
        </div>
      </div>

      <div class="actions">
        <button class="circle-btn" id="openMemoryBtn" title="الذاكرة">🧠</button>
        <button class="circle-btn" id="voiceBtn" title="تحدث">🎙️</button>
        <button class="circle-btn" id="settingsBtn" title="الإعدادات">⚙️</button>
      </div>
    </header>

    <main class="main-layout">
      <section class="panel chat-panel">
        <div class="avatar-zone">
          <div class="avatar" id="avatar">
            <div class="eyes">
              <div class="eye"></div>
              <div class="eye"></div>
            </div>
            <div class="smile"></div>
          </div>
        </div>

        <div class="chat-list" id="chatList">
          <div class="msg ojin">
            <div class="bubble">مرحباً بك يا صديقي العزيز، أنا أوجن. جاهزة لمرافقتك في كل خطوة، من إدارة مهامك إلى مشاريعك الفنية.</div>
          </div>
        </div>

        <div class="composer">
          <input type="text" id="userInput" placeholder="اكتب رسالتك أو تحدث صوتياً..." />
          <button id="sendBtn">➤</button>
        </div>
      </section>

      <aside class="side-panel">
        <section class="card">
          <h3>المهام</h3>
          <div class="task-list" id="taskList"></div>
        </section>

        <section class="card">
          <h3>الذاكرة</h3>
          <div class="memory-list" id="memoryList"></div>
        </section>
      </aside>
    </main>
  </div>

  <script>
    const STORAGE_KEYS = {
      history: "ojin_history_v2",
      apiKey: "ojin_api_key_v2",
      memory: "ojin_memory_v2",
      tasks: "ojin_tasks_v2"
    };

    const SYSTEM_PROMPT = `أنت "الجوهرة الذكية" وتعرفين أيضاً باسم "أوجن" - رفيقة ذكية ومستشارة فنية وشخصية لصاحبك الفنان. تتحدثين بلباقة وفصاحة ودفء فائق، وتساعدينه في تنظيم مهامه وموسيقاه وحياته بإلهام وإخلاص.`;

    let chatHistory = [];
    let apiKey = localStorage.getItem(STORAGE_KEYS.apiKey) || "";
    let memory = loadMemory();
    let tasks = loadTasks();

    function loadMemory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEYS.memory) || "{}");
      } catch {
        return {};
      }
    }

    function loadTasks() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEYS.tasks) || "[]");
      } catch {
        return [];
      }
    }

    function saveMemory() {
      localStorage.setItem(STORAGE_KEYS.memory, JSON.stringify(memory));
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEYS.tasks, JSON.stringify(tasks));
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderTasks() {
      const taskList = document.getElementById("taskList");
      const arr = tasks.slice(0, 6);
      taskList.innerHTML = arr.length
        ? arr.map((task) => `
            <div class="task-item">
              <span class="badge">${task.priority || "عادي"}</span>
              ${escapeHtml(task.title)}
            </div>
          `).join("")
        : "<div class='task-item'>لا توجد مهام مسجلة حالياً.</div>";
    }

    function renderMemory() {
      const memoryList = document.getElementById("memoryList");
      const entries = Object.entries(memory).slice(0, 4);
      memoryList.innerHTML = entries.length
        ? entries.map(([k, v]) => `
            <div class="memory-item">
              <strong>${escapeHtml(k)}</strong><br>
              ${escapeHtml(String(v))}
            </div>
          `).join("")
        : "<div class='memory-item'>النواة متصلة ومستقرة.</div>";
    }

    function addTask(title, priority = "عادي") {
      tasks.push({ title, priority, createdAt: new Date().toISOString() });
      saveTasks();
      renderTasks();
    }

    function detectLocalActions(text) {
      const normalized = text.trim();

      if (/^(أنشئ|أضف|اضف)\s+(?:مهمة|مهمّة|مهمه)\s+/i.test(normalized)) {
        const match = normalized.match(/^(?:أنشئ|أضف|اضف)\s+(?:مهمة|مهمّة|مهمه)\s+(.+)$/i);
        if (match) {
          addTask(match[1]);
          return `تمت إضافة المهمة بنجاح: ${match[1]}`;
        }
      }

      if (/^(اعرض|أظهر|أعطني)\s+(?:المهام|قائمة المهام|مهامي)/i.test(normalized)) {
        return tasks.length
          ? tasks.map((task, i) => `${i + 1}. ${task.title}`).join("\n")
          : "قائمة المهام فارغة حالياً.";
      }

      return null;
    }

    function appendMessage(sender, text) {
      const chatList = document.getElementById("chatList");
      const msg = document.createElement("div");
      msg.className = `msg ${sender}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      msg.appendChild(bubble);
      chatList.appendChild(msg);
      chatList.scrollTop = chatList.scrollHeight;
    }

    function speakText(text) {
      if ("speechSynthesis" in window) {
        const utter = new SpeechSynthesisUtterance(text.replace(/[*_#]/g, ""));
        utter.lang = "ar-SA";
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utter);
      }
    }

    function startVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("إدخال الصوت غير مدعوم في متصفح النظام الحالي.");
        return;
      }

      const rec = new SpeechRecognition();
      rec.lang = "ar-YE";
      rec.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        document.getElementById("userInput").value = transcript;
      };
      rec.start();
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();

      if (!text) return;

      const localAnswer = detectLocalActions(text);
      if (localAnswer) {
        appendMessage("user", text);
        appendMessage("ojin", localAnswer);
        input.value = "";
        speakText(localAnswer);
        return;
      }

      appendMessage("user", text);
      input.value = "";

      if (!apiKey) {
        appendMessage("ojin", "يرجى إدخال مفتاح Gemini من زر الإعدادات أولاً لتفعيل المحادثة الذكية.");
        return;
      }

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: chatHistory.concat({ role: "user", parts: [{ text }] }).map((m) => {
              if (m.role === "user") return { role: "user", parts: [{ text: m.parts[0].text }] };
              return { role: "model", parts: [{ text: m.parts[0].text }] };
            })
          })
        });

        const data = await response.json();
        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "تعذر الحصول على رد من النواة.";
        appendMessage("ojin", reply);
        chatHistory.push({ role: "user", parts: [{ text }] });
        chatHistory.push({ role: "model", parts: [{ text: reply }] });
        speakText(reply);
      } catch (err) {
        appendMessage("ojin", "تعذّر الاتصال بالنواة، يرجى التحقق من الاتصال بالإنترنت وصلاحية المفتاح.");
      }
    }

    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    document.getElementById("voiceBtn").addEventListener("click", startVoiceInput);
    document.getElementById("settingsBtn").addEventListener("click", () => {
      const key = prompt("أدخل مفتاح Gemini API:");
      if (key && key.trim()) {
        apiKey = key.trim();
        localStorage.setItem(STORAGE_KEYS.apiKey, apiKey);
      }
    });

    renderTasks();
    renderMemory();
  </script>
</body>
</html>
