<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أوجن | The AI Core</title>
    <link rel="manifest" href="/The-AI-Core/manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <style>
        :root {
            --gold: #d4af37;
            --dark: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            background: var(--dark);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        #bg-canvas {
            position: fixed; top: 0; left: 0; z-index: -1;
        }
        header {
            padding: 20px; text-align: center;
            border-bottom: 1px solid var(--gold);
            background: rgba(0,0,0,0.8);
        }
        header h1 {
            margin: 0; font-size: 1.5rem; color: var(--gold);
            text-shadow: 0 0 10px var(--gold);
        }
        #chat-container {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
        }
        .message {
            max-width: 85%; padding: 12px 18px; border-radius: 15px;
            line-height: 1.5; font-size: 1rem;
            animation: fadeIn 0.3s ease;
        }
        .user-msg {
            align-self: flex-end; background: var(--gold); color: black;
            border-bottom-right-radius: 2px;
        }
        .ai-msg {
            align-self: flex-start; background: var(--glass);
            border: 1px solid var(--gold); border-bottom-left-radius: 2px;
        }
        #input-area {
            padding: 20px; background: rgba(0,0,0,0.9);
            display: flex; gap: 10px; border-top: 1px solid var(--glass);
        }
        input {
            flex: 1; background: var(--glass); border: 1px solid var(--gold);
            border-radius: 25px; padding: 12px 20px; color: white; outline: none;
        }
        button {
            background: var(--gold); border: none; width: 50px; height: 50px;
            border-radius: 50%; cursor: pointer; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <header><h1>أوجن • Ojen</h1></header>
    <div id="chat-container">
        <div class="message ai-msg">أهلاً بك يا صديقي صدام.. أنا أوجن، كيانك الذكي. كيف يمكنني مرافقتك اليوم؟</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="تحدث معي يا صدام..." autocomplete="off">
        <button id="send-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function addMessage(text, isUser) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-msg' : 'ai-msg'}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;
            addMessage(text, true);
            userInput.value = '';
            
            // رد مؤقت حتى يتم ربط المحرك
            setTimeout(() => {
                addMessage("أنا أسمعك بوضوح.. واجهتي الآن تعمل بنجاح، ونحن بانتظار ربط عقلي الكامل (Colab).", false);
            }, 1000);
        }

        sendBtn.onclick = handleSend;
        userInput.onkeypress = (e) => { if(e.key === 'Enter') handleSend(); };

        // PWA Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/The-AI-Core/sw.js');
        }
    </script>
</body>
</html>
