name: Android APK Build

on:
  push:
    branches:
      - feature/ojin-android-foundation
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Install Gradle 8.9.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9.2-bin.zip
          sudo unzip -q gradle-8.9.2-bin.zip -d /opt
          echo "/opt/gradle-8.9.2/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper if missing
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9.2
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ojin-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
