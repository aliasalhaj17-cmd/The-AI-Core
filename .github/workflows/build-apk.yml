
```yaml
name: Build Ojin Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Assets and Capacitor
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js www/ 2>/dev/null || cp index.html www/
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Ojin AI" "com.ojin.core" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ojin APK
        uses: actions/upload-artifact@v4
        with:
          name: Ojin-AI-Core-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
```
